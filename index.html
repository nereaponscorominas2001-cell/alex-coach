/* Dieta: presentación visual y lectura rápida de cantidades */
.diet-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}

.diet-recipe{display:grid;grid-template-columns:minmax(180px, .9fr) minmax(0,1.1fr);gap:16px;margin-top:15px;padding-top:15px;border-top:1px solid #303030}

edia(max-width:560px){.review-scale-field{gap:5px}.review-scale-choice{border-radius:7px;font-size:13px;min-height:34px}}.review-photo-inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.review-photo-inputs input{font-size:12px;padding:10px 4px}.review-extra{margin-top:15px;border-top:1px solid #292929;padding-top:12px}.review-extra>summary{cursor:pointer;color:var(--lime);font-size:12px;font-weight:750;list-style:none}.review-extra>summary:before{content:"＋";margin-right:7px}.review-extra[open]>summary:before{content:"−"}.review-extra label{margin-top:12px}.review-submit-note{font-size:12px;color:#aaa;margin-top:18px;padding:12px;background:#090909;border-radius:10px}@media(max-width:560px){.review-measure-grid,.review-scale-grid,.review-photo-inputs{grid-template-columns:1fr}.review-tab>summary{min-height:66px;padding:11px}.review-tab-content{padding:0 12px 14px}}

function adjustMealsToMacros(meals,targets){
 const valid=(meals||[]).filter(m=>(m.foods||[]).length),count=valid.length;if(!count)return;
 const target=[Number(targets.protein)||0,Number(targets.carbs)||0,Number(targets.fat)||0];
 valid.forEach(meal=>{
  const foods=(meal.foods||[]).map(f=>({f,base:Math.max(0,Number(f.grams)||0),ratio:1,locked:!!f._locked,k:[Number(f.prot_100)||0,Number(f.hc_100)||0,Number(f.grasa_100)||0]}));
  const free=foods.filter(x=>!x.locked);if(!free.length)return;
  const calc=()=>foods.reduce((v,x)=>{x.k.forEach((n,j)=>v[j]+=n*(x.locked?x.base:x.base*x.ratio)/100);return v},[0,0,0]);
  const goal=target.map(x=>x/count),scale=goal.map(x=>Math.max(5,x)),w=[2.4,2.1,1.8];
  for(let z=0;z<2200;z++){const actual=calc(),err=actual.map((v,j)=>(v-goal[j])/scale[j]);let delta=0;free.forEach(x=>{const grad=x.k.reduce((s,n,j)=>s+2*w[j]*err[j]*(n*x.base/100)/scale[j],0)+.02*(x.ratio-1);const next=Math.max(.2,Math.min(5,x.ratio-.025*grad));delta=Math.max(delta,Math.abs(next-x.ratio));x.ratio=next});if(delta<1e-6)break;}
  free.forEach(x=>x.f.grams=Math.max(0,Math.round(x.base*x.ratio)));
 });
}
function adjustPlanSetMacros(setName){

 const t={protein:val("protein"),carbs:val("carbs"),fat:val("fat")};adjustMealsToMacros(meals,t);
 const kcal=Math.round(t.protein*4+t.carbs*4+t.fat*9);
 if(d.isMultiSetDiet){const old=d.meal_sets[setName].targets||{};d.meal_sets[setName].targets={...old,...t,kcal};}else d.targets={...d.targets,...t,kcal};

function normDiet(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
const dietFoodAliases={
 "aove":"aceite de oliva","aceite oliva":"aceite de oliva","proteina":"whey protein","whey":"whey protein",
 "claras":"clara de huevo","clara":"clara de huevo","huevo":"huevo entero","huevos":"huevo entero","avena":"avena en copos","pan":"pan blanco",
 "cereales mix mercadona 0":"cereales mix hacendado 0","tortas arroz":"tortitas de arroz","tortas":"tortitas de arroz",
 "pescado azul":"pescado azul","frutos rojos":"frutos rojos","fresas":"frutos rojos","fruto rojo":"frutos rojos","frutos rojos o fresas":"frutos rojos","arroz largo o basmati":"arroz basmati",
 "pasta de cualquier tipo":"pasta de trigo","burgers ternera o potro":"burger de ternera",
 "ternera picada para las fajitas":"ternera picada 99 carne cruda","carne roja":"ternera picada 99 carne cruda",
 "tiras pollo mercadona":"tiras de pollo","pechuga pavo":"pechuga de pavo","pechuga pollo":"pechuga de pollo cruda",
 "atun al natural":"atun al natural","crema cacahuete":"crema de cacahuete","crema de arroz":"crema de arroz"
};
function resolveDietFood(line){
 const raw=normDiet(line),alias=dietFoodAliases[raw]||raw;
 const exact=foodsCache.find(f=>normDiet(f.nombre)===alias);
 if(exact)return exact;
 const q=alias.split(" ").filter(x=>x.length>2);
 if(!q.length)return null;
 let best=null,bestScore=0;
 for(const f of foodsCache){
  const tokens=normDiet(f.nombre).split(" ").filter(x=>x.length>2);
  const hits=q.filter(x=>tokens.includes(x)).length,coverage=hits/q.length;
  if(!hits||coverage<0.8)continue;
  const precision=hits/Math.max(tokens.length,1),score=coverage*0.75+precision*0.25;
  if(score>bestScore){best=f;bestScore=score}
 }
 return best;
}
function matchDietFood(line){return resolveDietFood(line)}

   const optionalSupplementNote=s=>/lim[oó]n.*glutamina|glutamina.*lim[oó]n|vinagre\s+de\s+manzana/i.test(String(s||""));
  const makeRows=(groupText,offText)=>{
   const trainOptions=splitChoices(groupText).map(splitItems).filter(x=>x.length);
   if(!trainOptions.length)return null;
   const offOptions=offText?splitChoices(offText).map(splitItems).filter(x=>x.length):trainOptions.map(x=>x.map(y=>({...y})));
   // Cada // separa opciones excluyentes: importar únicamente la primera.
   // Los alimentos unidos por + sí forman parte de la misma opción y se conservan todos.
   const primary=trainOptions[0];
   const training=primary.map(x=>({...x,source_name:x.source_name,alternatives:[],choice_label:x.name+" · "+x.grams+" "+x.unit}));
   const recoveryPrimary=offOptions[0]||primary;
   const recovery=recoveryPrimary.map(x=>({...x,source_name:x.source_name,alternatives:[],choice_label:x.name+" · "+x.grams+" "+x.unit}));
   return {training,recovery};
  };
  const addLine=(meal,line)=>{
   const clean=String(line||"").replace(/^[\s\-–—•]+/,"").trim().replace(/\b(\d)\s+(\d)\s+(\d)(?=\s*(?:g|gr|gramos|mll|ml|cl|l)\b)/gi,"$1$2$3").replace(/\b(\d)\s+(\d)(?=\s*(?:g|gr|gramos|mll|ml|cl|l)\b)/gi,"$1$2");if(!clean)return false;
   if(optionalSupplementNote(clean))return false;
    if(/^(?:AYUNO|ENTRENAMIENTO|SUPLEMENTACI[ÓO]N|OBSERVACIONES)\b/i.test(clean)||excludedLine(clean)){excluded++;return false;}
   const m=clean.match(/^(.*?)\s*\(([^)]*d[ií]as?\s*off[^)]*)\)\s*$/i);
   const base=(m?m[1]:clean).trim(),annotation=m?m[2]:"";
   let offText="";
   if(/d[ií]as?\s*off/i.test(annotation))offText=annotation.replace(/^.*?d[ií]as?\s*off\s*/i,"").replace(/^cambiamos\s+por\s*/i,"").replace(/^por\s*/i,"").trim();
   const group=makeRows(base,offText);if(!group)return false;
   meal.training.foods.push(...group.training);
   if(/sin este\s*d[ií]as?\s*off/i.test(annotation))omitted++;else meal.recovery.foods.push(...group.recovery);
   detected++;return true;
  };
  if(hasMealColumn){
   const byMeal=new Map();let carry=1;
   const pages=[...new Set(pageRows.map(r=>r.page))].sort((a,b)=>a-b);
   for(const pageNo of pages){
    const rows=pageRows.filter(r=>r.page===pageNo&&!r.meal&&r.text).sort((a,b)=>b.y-a.y);
    const markers=pageRows.filter(r=>r.page===pageNo&&r.meal).sort((a,b)=>b.y-a.y);
    let last=carry,firstMarker=markers[0]?.y??Infinity;
    for(const r of rows){
     let mealNo;
     if(r.y>firstMarker+120&&carry&&pageNo>1)mealNo=carry;
     else if(markers.length){const nearest=markers.reduce((best,m)=>Math.abs(m.y-r.y)<Math.abs(best.y-r.y)?m:best,markers[0]);mealNo=nearest.meal;}
     else mealNo=carry;
     if(/SUPLEMENTACI[ÓO]N|OBSERVACIONES|AYUNO|ENTRENAMIENTO|NOTA\s*:/i.test(r.text+" "+r.section))continue;
      // En la primera página, todo lo situado antes del encabezado COMIDA 1 pertenece al bloque previo (ayuno) y no se importa.
      // No descartar por altura: en este PDF los alimentos de COMIDA 1 aparecen por encima de su rótulo.
     if(!byMeal.has(mealNo))byMeal.set(mealNo,[]);
     byMeal.get(mealNo).push(r.text);
    }
    if(markers.length)carry=Math.max(...markers.map(m=>m.meal));
   }
   for(const [mealNo,rows] of byMeal){
    const idx=mealNo-1;meals.training[idx]??={name:"Comida "+mealNo,foods:[]};meals.recovery[idx]??={name:"Comida "+mealNo,foods:[]};
    let logical=[];
    for(const row of rows){
     const t=row.replace(/\s+/g," ").trim();if(!t)continue;
     if(/^[-–—•]/.test(t)){if(logical.length)addLine({training:meals.training[idx],recovery:meals.recovery[idx]},logical.join(" "));logical=[t];}
     else if(logical.length)logical.push(t);
     else if(/\d+\s*(?:g|gr|ml|l|ud|huevo)/i.test(t))logical=[t];
     else notes.push(t);
    }
    if(logical.length)addLine({training:meals.training[idx],recovery:meals.recovery[idx]},logical.join(" "));
   }
   for(let i=0;i<5;i++){if(!meals.training[i])meals.training[i]={name:"Comida "+(i+1),foods:[]};if(!meals.recovery[i])meals.recovery[i]={name:"Comida "+(i+1),foods:[]};}
  }else{
   let currentMeal=null,logical=[];
   for(const r of pageRows){
    let line=r.text.replace(/\s+/g," ").trim();if(!line)continue;
    const h=line.match(/\bCOMIDA\s*([1-9])\b/i);
    if(h){if(logical.length&&currentMeal)addLine(currentMeal,logical.join(" "));logical=[];const idx=Number(h[1])-1;currentMeal={training:meals.training[idx]||{name:"Comida "+h[1],foods:[]},recovery:meals.recovery[idx]||{name:"Comida "+h[1],foods:[]}};meals.training[idx]=currentMeal.training;meals.recovery[idx]=currentMeal.recovery;line=line.replace(h[0]," ").trim();if(!line)continue}
    if(/^[-–—•]/.test(line)){if(logical.length&&currentMeal)addLine(currentMeal,logical.join(" "));logical=[line];}
    else if(logical.length)logical.push(line);
    else if(currentMeal)logical=[line];
   }
   if(logical.length&&currentMeal)addLine(currentMeal,logical.join(" "));
  }
  meals.training=meals.training.filter(Boolean);meals.recovery=meals.recovery.filter(Boolean);
  if(!detected)throw Error("No se han detectado alimentos. Comprueba que el PDF contiene texto seleccionable y que su estructura es compatible.");
  const calc=arr=>arr.reduce((a,m)=>{m.foods.forEach(x=>{let q=(+x.grams||0)/100;a.k+=(+x.kcal_100||0)*q;a.p+=(+x.prot_100||0)*q;a.c+=(+x.hc_100||0)*q;a.g+=(+x.grasa_100||0)*q});return a},{k:0,p:0,c:0,g:0});
  const unmatched=[...meals.training,...meals.recovery].flatMap(m=>m.foods).filter(x=>!x.food_id).length;
  if(unmatched)warnings.push(unmatched+" alimentos necesitan relacionarse con la biblioteca antes de publicar.");
  if(omitted)warnings.push(omitted+" alimento(s) marcados «sin este días OFF» se han omitido en descanso.");
  if(excluded)warnings.push(excluded+" líneas de ayuno, vegetales o gelatinas 0% se han excluido.");
  if(notes.length)warnings.push(notes.length+" indicaciones de ayuno, entrenamiento, suplementación y observaciones se han conservado.");
  const t=calc(meals.training),r=calc(meals.recovery);
  dietImport={fileName:file.name,client_id:document.querySelector("#pdfClient")?.value||null,name:file.name.replace(/\.pdf$/i,""),goal:"",notes:notes.join("\n\n"),meals:meals.training,recoveryMeals:meals.recovery,activeSet:"training",targetsTraining:{kcal:Math.round(t.k),protein:Math.round(t.p),carbs:Math.round(t.c),fat:Math.round(t.g)},targetsRecovery:{kcal:Math.round(r.k),protein:Math.round(r.p),carbs:Math.round(r.c),fat:Math.round(r.g)},warnings};
  dietImportMode=true;dietPdfFile=null;await draw();
 }catch(e){console.error("PDF diet import:",e);alert("No se ha podido leer el PDF: "+(e.message||"Error desconocido"))}
}

async function parseTrainingPdf(){
 const file=trainingPdfFile||document.querySelector("#trainingPdfFile")?.files?.[0];if(!file)return alert("Selecciona primero un PDF.");
 if(file.type!=="application/pdf"&&!file.name.toLowerCase().endsWith(".pdf"))return alert("El archivo debe ser un PDF.");
 if(file.size>20*1024*1024)return alert("El PDF no puede superar los 20 MB.");
 if(!window.pdfjsLib)return alert("No se ha podido cargar el lector PDF. Actualiza la página e inténtalo de nuevo.");
 try{
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,lines=[];
  for(let p=1;p<=pdf.numPages;p++){
   const page=await pdf.getPage(p),content=await page.getTextContent(),rows=new Map();
   for(const item of content.items){if(!item.str||!item.str.trim())continue;const y=Math.round(item.transform[5]/2)*2,a=rows.get(y)||[];a.push({x:item.transform[4],s:item.str.trim()});rows.set(y,a)}
   for(const [y,a] of rows){a.sort((x,z)=>x.x-z.x);const line=a.map(x=>x.s).join(" ").replace(/\s+/g," ").trim();if(line)lines.push({page:p,y,text:line})}
  }
  lines.sort((a,b)=>a.page-b.page||b.y-a.y);
  const days=[],general=[],warnings=[];
  const clean=s=>String(s||"").replace(/\s+/g," ").trim().replace(/^\|+|\|+$/g,"").trim();
  const normalizeDay=s=>clean(s).replace(/^D[IÍ]A\s*\d+\s*[|·—:-]?\s*/i,"").replace(/^D[IÍ]A\s*/i,"").trim();
  const isHeading=line=>/^(?:D[IÍ]A\s*\d+\s*[|·—:-]\s*.+|(?:LUNES|MARTES|MI[EÉ]RCOLES|JUEVES|VIERNES|S[ÁA]BADO|DOMINGO)\s*[|·—:-]\s*.+)$/i.test(line);
  const addText=(obj,key,value,sep=" ")=>{if(value)obj[key]=(obj[key]?obj[key]+sep:"")+value};
  const parseExercise=line=>{
   const raw=clean(line).replace(/^[-•–]\s*/,"");
   if(!raw)return null;
   const topBack=raw.match(/^(.+?)\s+(\d+)\s+Top\s*Set\s*:\s*(\d+(?:\s*[–-]\s*\d+)?)\s*reps?\s*[—–-]\s*(\d+)\s+Back\s*Off\s*:\s*(\d+(?:\s*[–-]\s*\d+)?)\s*reps?\s*[—–-]?\s*$/i);
   if(topBack){
    const name=clean(topBack[1]),topSets=Number(topBack[2]),backSets=Number(topBack[4]);
    const topReps=clean(topBack[3]).replace(/\s*[–-]\s*/g,"–"),backReps=clean(topBack[5]).replace(/\s*[–-]\s*/g,"–");
    if(name.length>=3)return {name,sets:topSets+backSets,reps:topSets+" Top Set ("+topReps+") / "+backSets+" Back Off ("+backReps+")",rest:90,notes:topSets+" serie"+(topSets===1?"":"s")+" Top Set: "+topReps+" reps · "+backSets+" serie"+(backSets===1?"":"s")+" Back Off: "+backReps+" reps",video_url:"",_cardio:false};
   }
   // Dos bloques de una serie: interpretar como Top Set (TP) y Back Off (BO).
   const colonForBlocks=raw.lastIndexOf(":");
   if(colonForBlocks>2){
    const exerciseName=clean(raw.slice(0,colonForBlocks)),prescription=clean(raw.slice(colonForBlocks+1));
    const blocks=[...prescription.matchAll(/(\d+)\s*[x×]\s*(\d+(?:\s*(?:a|hasta|[-–])\s*\d+)?)/gi)];
    if(blocks.length===2){
     const counts=blocks.map(m=>Number(m[1])),ranges=blocks.map(m=>clean(m[2]).replace(/\s*(?:a|hasta|[-–])\s*/gi,"–"));
     const totalSets=counts[0]+counts[1];
     return {name:exerciseName,sets:totalSets,reps:counts[0]+" TP (Top Set: "+ranges[0]+") / "+counts[1]+" BO (Back Off: "+ranges[1]+")",rest:90,notes:counts[0]+" serie"+(counts[0]===1?"":"s")+" TP (Top Set): "+ranges[0]+" reps · "+counts[1]+" serie"+(counts[1]===1?"":"s")+" BO (Back Off): "+ranges[1]+" reps",video_url:"",_cardio:false};
    }
   }
   const standard=raw.match(/^(.+?)\s+(\d+(?:\s*[–-]\s*\d+)?)\s*[x×]\s*(\d+(?:\s*[–-]\s*\d+)?)(?:\s*reps?)?(.*)$/i);
   if(standard){
    const name=clean(standard[1]),setText=clean(standard[2]).replace(/\s*[–-]\s*/g,"–"),reps=clean(standard[3]).replace(/\s*[–-]\s*/g,"–"),suffix=clean(standard[4]);
    if(name.length<3)return null;
    const setParts=setText.split("–").map(Number),sets=Math.max(...setParts),notes=[];
    if(setParts.length>1)notes.push("Rango de series: "+setText);
    if(suffix)notes.push(suffix.replace(/^[-—–,;]+\s*/,""));
    return {name,sets,reps,rest:90,notes:notes.join(" · "),video_url:"",_cardio:/stairmaster|cardio|cinta|bicicleta|el[ií]ptica|caminar/i.test(name)};
   }
   const colon=raw.lastIndexOf(":");
   const name=colon>1?clean(raw.slice(0,colon)):raw,prescription=colon>1?clean(raw.slice(colon+1)):"";
   // Formato por serie: "Nombre: 15 12 10 en cada serie".
   const perSetSource=prescription||raw;
   const perSet=perSetSource.match(/^(\d+(?:\s+\d+){1,})\s+en cada serie\s*$/i);
   if(perSet){
    const exerciseName=name,repValues=perSet[1].trim().split(/\s+/);
    if(exerciseName.length>=3)return {name:exerciseName,sets:repValues.length,reps:repValues.join(" / "),rest:90,notes:"Repeticiones por serie: "+repValues.join(" · "),video_url:"",_cardio:/stairmaster|cardio|cinta|bicicleta|el[ií]ptica|caminar/i.test(exerciseName)};
   }
   if(!prescription||name.length<3)return null;
   // Admite varios bloques: "1x 6 a 10 1x 11 a 14".
   const blocks=[...prescription.matchAll(/(\d+)\s*[x×]\s*(\d+(?:\s*(?:a|hasta|[-–])\s*\d+)?)/gi)];
   if(!blocks.length)return null;
   const sets=blocks.reduce((n,m)=>n+Number(m[1]||0),0);
   const reps=blocks.map(m=>clean(m[2]).replace(/\s*(?:a|hasta|[-–])\s*/gi,"–")).join(" / ");
   const remainder=prescription.replace(/(\d+)\s*[x×]\s*(\d+(?:\s*(?:a|hasta|[-–])\s*\d+)?)/gi," ").replace(/[·—–,;]+/g," ").trim();
   const special=/cluster|descendente|drop.?set|fallo|RIR|pausa|tempo/i.test(remainder);
   return {name,sets,reps:reps||prescription,rest:90,notes:special?"Técnica especial: "+remainder:"",video_url:"",_cardio:/stairmaster|cardio|cinta|bicicleta|el[ií]ptica|caminar/i.test(name)};
  };
  let current=null;
  for(const row of lines){
   const line=clean(row.text);if(!line)continue;
   if(isHeading(line)){
    const name=normalizeDay(line);
    current={name:name||("Día "+(days.length+1)),description:"",notes:"",cardio:"",exercises:[]};days.push(current);continue;
   }
   if(!current){
    if(!/^(?:image|ejercicio|series|repeticiones|plan semanal|distribuci[oó]n semanal)$/i.test(line))general.push(line);
    continue;
   }
   if(/^(?:trabajo de zona media|zona media|abdominales?)\s*:?/i.test(line)){addText(current,"notes",line,"\n");continue}
   if(/^prioridades de ejecuci[oó]n|^indicaciones|^notas/i.test(line)){addText(current,"notes",line,"\n");continue}
   if(/^ejercicio\s+series\s+repeticiones/i.test(line)||/^[-| ]*(?:-----|ejercicio|series|repeticiones)[-| ]*$/i.test(line))continue;
   if(/^alex vicent|^plan de temporada|^objetivo semanal/i.test(line)){general.push(line);continue}
   if(/^[-•–]\s*/.test(line)){addText(current,"notes",line.replace(/^[-•–]\s*/,""),"\n");continue}
   const exercise=parseExercise(line);
   if(exercise){
    const { _cardio,...saved }=exercise;current.exercises.push(saved);
    if(_cardio||/\b\d+\s*(?:min|minutos)\b/i.test(line))addText(current,"cardio",line," · ");
    continue;
   }
   if(/\b\d+\s*(?:min|minutos)\b/i.test(line)&&/stairmaster|cardio|cinta|bicicleta|el[ií]ptica|caminar/i.test(line)){addText(current,"cardio",line," · ");continue}
   addText(current,"notes",line,"\n");
  }
  if(!days.length)throw Error("No he detectado sesiones. Se admiten encabezados como «DÍA 1 | EMPUJES A», «DÍA 2 | TIRONES A» o «LUNES | PIERNA».");
  const total=days.reduce((n,d)=>n+d.exercises.length,0);
  if(!total)warnings.push("Se detectaron las sesiones, pero no los ejercicios. Comprueba que el PDF tenga texto seleccionable; los PDF escaneados necesitan OCR.");
  if(days.some(d=>!d.exercises.length))warnings.push("Hay sesiones sin ejercicios reconocidos. Revísalas antes de publicar.");
  if(days.some(d=>d.exercises.some(x=>/TP|BO|RIR|pausa/i.test(x.reps))))warnings.push("Se han conservado las técnicas especiales dentro de la prescripción. Comprueba las series TP/BO y las indicaciones.");
  trainingImport={fileName:file.name,client_id:document.querySelector("#trainingPdfClient")?.value||null,name:file.name.replace(/\.pdf$/i,""),goal:"",notes:general.join("\n"),days,warnings};
  trainingImportMode=true;trainingPdfFile=null;await draw();
 }catch(e){console.error("PDF training import:",e);alert("No se ha podido leer el PDF: "+(e.message||"Error desconocido"))}
}
async function saveImportedTraining(){
 const d=trainingImport;if(!d)return;const clientId=document.querySelector("#trainingPdfClient")?.value||d.client_id,name=document.querySelector("#trainingPdfName")?.value.trim(),goal=document.querySelector("#trainingPdfGoal")?.value||"",notes=document.querySelector("#trainingPdfNotes")?.value||"";
 if(!clientId)return alert("Selecciona un cliente.");if(!name)return alert("Escribe un nombre para el entrenamiento.");
 if(!d.days.length||!d.days.some(x=>x.exercises.length))return alert("No hay ejercicios detectados. Revisa el PDF antes de publicar.");

function buildDietSwapOptions(rows){
 const groups=[
  {id:"group_nuts",nombre:"Frutos secos",members:["Almendras","Anacardos","Avellanas","Nueces","Pistachos"]},
  {id:"group_red_berries",nombre:"Frutos rojos",members:["Fresas","Frambuesas","Arándanos"]},
  {id:"group_nut_butters",nombre:"Cremas de frutos secos",members:["Crema de almendras","Crema de cacahuete"]},
  {id:"group_oils",nombre:"Aceites",members:["Aceite de coco","Aceite de oliva"]},
  {id:"group_rice",nombre:"Arroz",members:["Arroz basmati","Arroz blanco","Arroz integral"]},
  {id:"group_pasta",nombre:"Pasta",members:["Pasta de trigo","Pasta integral"]},
  {id:"group_potato",nombre:"Patata",members:["Patata","Patata cocida"]},
  {id:"group_sweet_potato",nombre:"Boniato",members:["Boniato","Boniato asado"]},
  {id:"group_white_fish",nombre:"Pescado blanco",members:["Bacalao desalado","Bacalao fresco","Dorada","Lubina","Merluza"]},
  {id:"group_poultry",nombre:"Aves magras",members:["Pechuga de pollo (cruda)","Pechuga de pavo"]},
  {id:"group_lean_meat",nombre:"Carne magra",members:["Solomillo de cerdo","Ternera magra (cruda)","Ternera picada 99% carne (cruda)"]},
  {id:"group_shellfish",nombre:"Marisco",members:["Gambas","Langostinos"]},
  {id:"group_protein_yogurt",nombre:"Yogur alto en proteína 0%",members:["Yogur alto en proteína 0%","Yogur griego natural 0%"]}
 ];
 const groupedNames=new Set(),aggregates=[];
 groups.forEach(g=>{
  const items=g.members.map(n=>rows.find(f=>f.nombre===n)).filter(Boolean);
  if(items.length<2)return;
  items.forEach(f=>groupedNames.add(f.nombre));
  const avg=key=>items.reduce((sum,f)=>sum+(+f[key]||0),0)/items.length;
  aggregates.push({id:g.id,nombre:g.nombre,kcal_100:avg("kcal_100"),prot_100:avg("prot_100"),hc_100:avg("hc_100"),grasa_100:avg("grasa_100"),es_grupo:true,miembros:items.map(f=>f.nombre)});
 });

}
function dietFoodCategory(f){

 return h>=p&&h>=g?"H":p>=g?"P":"G";

 if(/calabacin|calabaza|berenjena|brocoli|cebolla|champi|coliflor|esparrago|espinaca|judia verde|lechuga|pepino|pimiento|tomate|zanahoria|verdura/.test(n))return "verduras";
 if(/fresa|frambuesa|arandano|frutos rojos|kiwi|limon|mandarina|manzana|pera|melocoton|melon|naranja|pina|platano|sandia|uva|fruta/.test(n)||id==="group_red_berries")return "fruta";

 if(id==="group_nuts"||id==="group_nut_butters"||id==="group_oils"||/almendra|anacardo|avellana|nuez|pistacho|cacahuete|crema de frutos secos|aceite|mantequilla|semillas|chia|lino|aguacate|guacamole/.test(n))return "grasas";

}
function dietFoodIsCompatible(source,candidate,sourceGrams,sourceMacro,macroKey){

async function saveRegularExerciseLog(exerciseId,name,di,dj,setCount){
 const count=Math.max(1,Math.min(12,Number(setCount)||1)),sets=[];
 for(let i=0;i<count;i++){const kg=Number(sv("setkg_"+di+"_"+dj+"_"+i));if(!Number.isFinite(kg)||kg<=0)return alert("Introduce el peso de la serie "+(i+1)+".");sets.push({exercise_name:name,kg,topkg:null,is_topset:false,reps:null,completed:true,day_index:Number(di),slot_key:di+"-"+dj,set_number:i+1,completed_at:new Date().toISOString()});}
 const r=await sb.from("workout_logs").insert({client_id:me.id,exercise_id:exerciseId||null,fecha:today(),sets});
 if(r.error)return alert("No se pudieron guardar las series: "+r.error.message);
 alert("Pesos de las "+count+" series guardados.");draw();
}
async function saveExerciseLog(exerciseId,name,di,dj,percentagesCsv){
 const topkg=Number(sv("kg_"+di+"_"+dj));
 if(!Number.isFinite(topkg)||topkg<=0)return alert("Introduce el peso máximo de la TOP SET.");
 const percentages=String(percentagesCsv||"").split(",").map(Number);
 if(!percentages.length||percentages.some(v=>!Number.isFinite(v)||v<=0||v>100)||percentages[percentages.length-1]!==100)return alert("Los porcentajes no son válidos. La TOP SET debe ser el 100%.");
 const setLoads=percentages.map((pct,i)=>({series:i+1,percentage:pct,kg:Math.round(topkg*pct/100*2)/2}));
 const fecha=today(),d=new Date();
 const r=await sb.from("workout_logs").insert({client_id:me.id,exercise_id:exerciseId||null,fecha,sets:[{exercise_name:name,kg:topkg,topkg,is_topset:true,set_loads,reps:null,completed:true,day_index:Number(di),slot_key:di+"-"+dj,completed_at:d.toISOString()}]});
 if(r.error)return alert("No se pudo guardar la TOP SET: "+r.error.message);
 alert("TOP SET guardada. Se han calculado las cargas de las "+percentages.length+" series.");draw();
}
async function toggleExerciseDone(checked,exerciseId,name,di,dj){
 const d=new Date(),fecha=today();
 const r=await sb.from("workout_logs").insert({client_id:me.id,exercise_id:exerciseId||null,fecha,sets:[{exercise_name:name,kg:null,topkg:null,is_topset:false,reps:null,completed:checked,day_index:Number(di),slot_key:di+"-"+dj,completed_at:d.toISOString()}]});
 if(r.error){alert(r.error.message);draw();return}draw();
}
async function saveMeasurements(){const r=await sb.from("measurements").insert({client_id:me.id,fecha:sv("mDate"),cintura:nv("mWaist"),cadera:nv("mHip"),gluteos:nv("mGlute"),muslo:nv("mThigh"),brazo:nv("mArm"),pecho:nv("mChest")});if(r.error)return alert(r.error.message);draw()}
async function uploadProgressPhoto(){const file=document.querySelector("#progressPhoto")?.files?.[0];if(!file)return alert("Selecciona una foto");if(!file.type.startsWith("image/")||file.size>12*1024*1024)return alert("La imagen debe ser válida y pesar menos de 12 MB");const path=me.id+"/"+Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const up=await sb.storage.from("progress-photos").upload(path,file,{contentType:file.type,upsert:false});if(up.error)return alert(up.error.message);const row=await sb.from("photos").insert({client_id:me.id,fecha:today(),tipo:"Progreso",path});if(row.error)return alert(row.error.message);draw()}
async function saveMyProfile(){const r=await sb.from("profiles").update({nombre:sv("myName"),apellidos:sv("mySurname"),edad:nv("myAge"),telefono:sv("myPhone"),altura_cm:nv("myHeight"),profesion:sv("myJob"),objetivo:sv("myGoal"),alergias:sv("myAllergies"),patologias:sv("myPathologies"),lesiones:sv("myInjuries"),preferencias_alimentarias:sv("myFoodPrefs")}).eq("id",me.id);if(r.error)return alert(r.error.message);alert("Perfil actualizado");boot()}

document.addEventListener('input',e=>{if(e.target?.id==='stepsToday'||e.target?.id==='stepsGoal')refreshStepProgress()});
let observedLocalDay=today();const checkDietDayRollover=()=>{const current=today();if(current!==observedLocalDay){observedLocalDay=current;if(me)draw()}};setInterval(checkDietDayRollover,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDietDayRollover()});
boot();
