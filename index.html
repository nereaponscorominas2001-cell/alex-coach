<style>
:root{--bk:#000;--lime:#B6F36B;--wh:#fff;--g1:#171717;--g2:#777;--line:#262626;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bk);color:var(--wh);font:15px/1.5 "Helvetica Neue",Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line)}

nav{display:flex;gap:6px;padding:12px 24px;overflow-x:auto}

main{max-width:1000px;margin:0 auto;padding:24px}
h1{font-size:clamp(30px,6vw,52px);line-height:1;margin:8px 0 24px;font-weight:900;text-transform:uppercase}h1 em{color:var(--lime);font-style:normal}
h3{margin:0 0 12px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--g2)}
.card{background:var(--g1);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}.stat{font-size:38px;font-weight:900;color:var(--lime)}
input,select,textarea{width:100%;background:var(--bk);border:1px solid var(--line);color:var(--wh);padding:11px 12px;border-radius:8px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--lime)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}label{color:var(--g2);font-size:13px}
.btn{background:var(--lime);color:#000;border:0;font:inherit;font-weight:800;padding:11px 18px;border-radius:8px;cursor:pointer}.btn.ghost{background:none;color:var(--wh);border:1px solid var(--line)}.btn.sm{padding:6px 10px;font-size:13px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--g2);font-size:12px;text-transform:uppercase}.scroll{overflow-x:auto}
.muted{color:var(--g2)}.tag{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--lime);color:#000}.tag.off{background:var(--line);color:var(--g2)}
.auth{max-width:380px;margin:8vh auto}.msg p{margin:0 0 10px}.msg b{color:var(--lime)}
@media(max-width:640px){header,nav,main{padding-left:16px;padding-right:16px}}
</style></head><body>

<script>
const sb=supabase.createClient("https://fkcmpslsdbmeufcunajg.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrY21wc2xzZGJtZXVmY3VuYWpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyMjM2MDMsImV4cCI6MjExMDc5OTYwM30.1gnHrsY_X3trq9PBI1mVTk6EYxLBfNN58Efp6Gx_gAk");
const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10),nv=id=>{const v=$("#"+id).value;return v===""?null:+v},sv=id=>$("#"+id).value;

async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){me=null;return draw()}
 const r=await sb.from("profiles").select("*").eq("id",session.user.id).single();me=r.data;draw()}

 if(!me){nav.innerHTML="";app.innerHTML=authV();return}
 if(!me.consentimiento_rgpd_at){nav.innerHTML="";app.innerHTML=`<div class="auth card"><h3>Protección de datos</h3><p>Para usar la plataforma necesito tu consentimiento para tratar tus datos de salud, medidas y fotografías con el fin de gestionar tu asesoría. Puedes retirarlo cuando quieras.</p><label><input type="checkbox" id="cons" style="width:auto"> Acepto el tratamiento de mis datos</label><br><br><button class="btn" onclick="consent()">Continuar</button></div>`;return}
 const T=me.role=="admin"?AT:CT;nav.innerHTML=T.map(([k,l])=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';sel=null;draw()">${l}</button>`).join("");
 app.innerHTML='<p class="muted">Cargando…</p>';app.innerHTML=await V[(me.role=="admin"?"a_":"c_")+tab]()}

<button class="btn" onclick="login()">Entrar</button> <button class="btn ghost" onclick="signup()">Crear cuenta</button><p><a href="#" style="color:var(--lime)" onclick="reset();return false">Recuperar contraseña</a></p></div>`}
async function login(){ok(await sb.auth.signInWithPassword({email:sv("em"),password:sv("pw")}))}
async function signup(){const r=await sb.auth.signUp({email:sv("em"),password:sv("pw")});if(ok(r)&&!r.data.session)alert("Revisa tu correo para confirmar la cuenta.")}
async function reset(){if(ok(await sb.auth.resetPasswordForEmail(sv("em"))))alert("Si el correo existe, recibirás un enlace.")}
async function consent(){if(!$("#cons").checked)return alert("Necesitas aceptar para continuar");if(ok(await sb.from("profiles").update({consentimiento_rgpd_at:new Date().toISOString()}).eq("id",me.id)))boot()}
const msgsV=async cid=>{const{data}=await sb.from("messages").select("*").eq("client_id",cid).order("created_at");
 return`<div class="card msg">${(data||[]).map(m=>`<p><b>${m.sender_id==me.id?"Yo":"Mensaje"}</b> <span class="muted">${new Date(m.created_at).toLocaleString("es-ES")}</span><br>${esc(m.body)}</p>`).join("")||'<p class="muted">Sin mensajes</p>'}</div><div class="row"><input id="mt" placeholder="Escribe un mensaje…"><button class="btn" onclick="send('${cid}')">Enviar</button></div>`};
async function send(cid){const body=sv("mt").trim();if(body&&ok(await sb.from("messages").insert({client_id:cid,sender_id:me.id,body})))draw()}
const V={
async c_inicio(){const[d,p,n]=await Promise.all([sb.from("daily_logs").select("fecha,peso").eq("client_id",me.id).not("peso","is",null).order("fecha",{ascending:false}).limit(1),sb.from("plans").select("tipo,nombre").eq("client_id",me.id).eq("activo",true),sb.from("notifications").select("id").is("read_at",null)]);
 return`<h1>Hola${me.nombre?", <em>"+esc(me.nombre)+"</em>":""}</h1><div class="grid"><div class="card"><h3>Peso actual</h3><div class="stat">${d.data?.[0]?.peso??"-"}</div></div><div class="card"><h3>Objetivo</h3><b>${esc(me.objetivo)||"-"}</b></div><div class="card"><h3>Avisos nuevos</h3><div class="stat">${n.data?.length||0}</div></div></div>
 <div class="card"><h3>Tus planes</h3>${(p.data||[]).map(x=>`<p><span class="tag">${x.tipo}</span> ${esc(x.nombre)}</p>`).join("")||'<p class="muted">Tu entrenadora aún no te ha asignado planes.</p>'}</div>`},
async c_diario(){const{data}=await sb.from("daily_logs").select("*").eq("client_id",me.id).order("fecha",{ascending:false}).limit(14);
 return`<h1>Registro <em>diario</em></h1><div class="card"><div class="row">${F("d_f","Fecha","date",today())}${F("d_p","Peso (kg)")}${F("d_e","Energía 1-10")}${F("d_h","Hambre 1-10")}${F("d_s","Sueño 1-10")}${F("d_hs","Horas dormidas")}${F("d_st","Estrés 1-10")}${F("d_a","Ánimo 1-10")}${SEL("d_d","¿Seguiste la dieta?",[["si","Sí"],["parcial","Parcialmente"],["no","No"]])}${F("d_w","Agua (L)")}${F("d_pa","Pasos")}${SEL("d_en","¿Entrenaste?",[["true","Sí"],["false","No"]])}${F("d_c","Cardio (min)")}</div>
 <textarea id="d_o" rows="2" placeholder="Observaciones, molestias, comida extra…"></textarea><br><br><button class="btn" onclick="saveDaily()">Guardar</button></div>
 <div class="card scroll"><table><tr><th>Fecha</th><th>Peso</th><th>Energía</th><th>Agua</th><th>Pasos</th><th>Dieta</th></tr>${(data||[]).map(d=>`<tr><td>${d.fecha}</td><td>${d.peso??"-"}</td><td>${d.energia??"-"}</td><td>${d.agua_l??"-"}</td><td>${d.pasos??"-"}</td><td>${d.sigue_dieta??"-"}</td></tr>`).join("")}</table></div>`},
async c_revision(){const{data}=await sb.from("reviews").select("*").eq("client_id",me.id).order("fecha",{ascending:false});
 return`<h1><em>Revisiones</em></h1><div class="card"><div class="row">${F("r_f","Fecha","date",today())}${F("r_p","Peso (kg)")}${F("r_ad","Adherencia dieta %")}${F("r_at","Adherencia entreno %")}${F("r_e","Energía 1-10")}${F("r_h","Hambre 1-10")}${F("r_s","Sueño 1-10")}${F("r_st","Estrés 1-10")}</div>
 <textarea id="r_c" rows="3" placeholder="Dificultades, cambios físicos, comentarios…"></textarea><br><br><button class="btn" onclick="saveRev()">Enviar revisión</button></div>
 ${(data||[]).map(r=>`<div class="card"><b>${r.fecha} · ${r.peso??"-"} kg</b> <span class="tag ${r.estado=="completada"?"":"off"}">${r.estado}</span><p class="muted">${esc(r.comentarios)}</p>${r.feedback?`<p><b style="color:var(--lime)">Feedback:</b> ${esc(r.feedback)}</p>`:""}</div>`).join("")}`},
async c_mensajes(){return`<h1><em>Mensajes</em></h1>`+await msgsV(me.id)},
async a_inicio(){const[c,r]=await Promise.all([sb.from("profiles").select("id,estado").eq("role","client"),sb.from("reviews").select("id").eq("estado","pendiente")]);
 return`<h1>Resumen <em>general</em></h1><div class="grid"><div class="card"><h3>Clientes</h3><div class="stat">${c.data?.length||0}</div></div><div class="card"><h3>Activos</h3><div class="stat">${(c.data||[]).filter(x=>x.estado=="activo").length}</div></div><div class="card"><h3>Revisiones pendientes</h3><div class="stat">${r.data?.length||0}</div></div></div>`},
async a_clientes(){if(sel)return await clientV(sel);const{data}=await sb.from("profiles").select("*").eq("role","client").order("created_at",{ascending:false});
 return`<h1><em>Clientes</em></h1><div class="card scroll"><table><tr><th>Nombre</th><th>Correo</th><th>Objetivo</th><th>Estado</th><th></th></tr>${(data||[]).map(c=>`<tr><td>${esc(c.nombre)||"-"}</td><td>${esc(c.email)}</td><td>${esc(c.objetivo)}</td><td><span class="tag ${c.estado=="activo"?"":"off"}">${c.estado}</span></td><td><button class="btn sm" onclick="sel='${c.id}';draw()">Abrir</button> <button class="btn ghost sm" onclick="setEstado('${c.id}','${c.estado=="activo"?"inactivo":"activo"}')">${c.estado=="activo"?"Desactivar":"Activar"}</button></td></tr>`).join("")||'<tr><td class="muted">Aún no hay clientes registrados</td></tr>'}</table></div>`}
,async a_planes(){if(planDraft)return await planEditor();const[c,p]=await Promise.all([sb.from("profiles").select("id,nombre,email").eq("role","client").order("nombre"),sb.from("plans").select("*").order("created_at",{ascending:false}).limit(100)]);return `<h1>Planes <em>de asesoría</em></h1><div class="card"><h3>Crear planificación</h3><div class="row"><label>Cliente<select id="planClient">${(c.data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.nombre||x.email)+'</option>').join("")}</select></label><button class="btn" onclick="newPlan('dieta')">+ Crear dieta</button><button class="btn" onclick="newPlan('entrenamiento')">+ Crear entrenamiento</button></div><p class="muted">Cada publicación crea una nueva versión y conserva las anteriores.</p></div><div class="card scroll"><table><tr><th>Cliente</th><th>Tipo</th><th>Plan</th><th>Versión</th><th>Estado</th><th></th></tr>${(p.data||[]).map(x=>'<tr><td>'+esc((c.data||[]).find(y=>y.id===x.client_id)?.nombre||"Cliente")+'</td><td>'+esc(x.tipo)+'</td><td>'+esc(x.nombre)+'</td><td>v'+x.version+'</td><td>'+(x.activo?'<span class="tag">Activo</span>':'<span class="tag off">Histórico</span>')+'</td><td><button class="btn sm ghost" onclick="editPlan(\''+x.id+'\')">Ver / nueva versión</button></td></tr>').join("")||'<tr><td colspan="6">Todavía no hay planes.</td></tr>'}</table></div>`},
async a_biblioteca(){const [f,e]=await Promise.all([sb.from("foods").select("*").order("nombre"),sb.from("exercises").select("*").order("nombre")]);foodsCache=f.data||[];exCache=e.data||[];return `<h1>Biblioteca <em>de recursos</em></h1><div class="grid"><div class="card"><h3>Nuevo alimento</h3><div class="row">${F("foodName","Nombre","text")}${F("foodK","Kcal / 100 g")}${F("foodP","Proteína / 100 g")}${F("foodC","Hidratos / 100 g")}${F("foodG","Grasas / 100 g")}</div><button class="btn" onclick="saveFood()">Guardar alimento</button><div class="scroll"><table><tr><th>Alimento</th><th>Kcal</th><th>P</th><th>HC</th><th>G</th></tr>${foodsCache.map(x=>'<tr><td>'+esc(x.nombre)+'</td><td>'+x.kcal_100+'</td><td>'+x.prot_100+'</td><td>'+x.hc_100+'</td><td>'+x.grasa_100+'</td></tr>').join("")}</table></div></div><div class="card"><h3>Nuevo ejercicio</h3><div class="row">${F("exName","Nombre","text")}${F("exGroup","Grupo muscular","text")}${F("exVideo","URL vídeo","url")}</div><label>Indicaciones<textarea id="exNotes" rows="2"></textarea></label><button class="btn" onclick="saveExercise()">Guardar ejercicio</button><div class="scroll"><table><tr><th>Ejercicio</th><th>Grupo</th><th>Vídeo</th></tr>${exCache.map(x=>'<tr><td>'+esc(x.nombre)+'</td><td>'+esc(x.grupo_principal)+'</td><td>'+(x.video_url?'<a target="_blank" rel="noopener" href="'+esc(x.video_url)+'">Ver</a>':'—')+'</td></tr>').join("")}</table></div></div></div>`},
async a_plantillas(){const {data}=await sb.from("templates").select("*").order("created_at",{ascending:false});return `<h1>Plantillas <em>reutilizables</em></h1><div class="card"><p>Guarda una planificación como plantilla desde el editor de planes. Al asignarla a otro cliente se crea una copia independiente; nunca se modifica la plantilla original.</p></div><div class="grid">${(data||[]).map(t=>'<div class="card"><span class="tag">'+esc(t.tipo)+'</span><h3 style="margin-top:12px;color:#fff">'+esc(t.nombre)+'</h3><p class="muted">'+esc(t.objetivo)+'</p><button class="btn sm" onclick="useTemplate(\''+t.id+'\')">Asignar a cliente</button></div>').join("")||'<div class="card muted">Aún no hay plantillas guardadas.</div>'}</div>`},
async c_dieta(){const {data}=await sb.from("plans").select("*").eq("client_id",me.id).eq("tipo","dieta").eq("activo",true).order("created_at",{ascending:false}).limit(1);const p=data?.[0];if(!p)return '<h1>Mi <em>alimentación</em></h1><div class="card">Tu entrenador todavía no ha publicado una dieta.</div>';const d=p.data||{},t=d.targets||{},meals=d.meals||[];return `<h1>Mi <em>alimentación</em></h1><div class="card"><h2>${esc(p.nombre)}</h2><p class="muted">${esc(p.objetivos)}</p><div class="grid"><div><h3>Kcal objetivo</h3><div class="stat">${t.kcal||"—"}</div></div><div><h3>Proteína</h3><div class="stat">${t.protein||"—"} g</div></div><div><h3>Hidratos</h3><div class="stat">${t.carbs||"—"} g</div></div><div><h3>Grasas</h3><div class="stat">${t.fat||"—"} g</div></div></div></div>${meals.map((m,i)=>{const total=(m.foods||[]).reduce((a,x)=>{const q=(+x.grams||0)/100;return {k:a.k+(+x.kcal_100||0)*q,p:a.p+(+x.prot_100||0)*q,c:a.c+(+x.hc_100||0)*q,g:a.g+(+x.grasa_100||0)*q}},{k:0,p:0,c:0,g:0});return '<div class="card"><h3>Comida '+(i+1)+'</h3><h2>'+esc(m.name)+'</h2><div class="scroll"><table><tr><th>Alimento</th><th>Cantidad</th><th>Kcal</th><th>P</th><th>HC</th><th>G</th></tr>'+(m.foods||[]).map(x=>{const q=(+x.grams||0)/100;return '<tr><td>'+esc(x.name)+'</td><td>'+x.grams+' g</td><td>'+Math.round((+x.kcal_100||0)*q)+'</td><td>'+((+x.prot_100||0)*q).toFixed(1)+'</td><td>'+((+x.hc_100||0)*q).toFixed(1)+'</td><td>'+((+x.grasa_100||0)*q).toFixed(1)+'</td></tr>'}).join("")+'</table></div><p class="muted">Total comida: '+Math.round(total.k)+' kcal · P '+total.p.toFixed(1)+' g · HC '+total.c.toFixed(1)+' g · G '+total.g.toFixed(1)+' g</p></div>'}).join("")}`},
async c_entreno(){const {data}=await sb.from("plans").select("*").eq("client_id",me.id).eq("tipo","entrenamiento").eq("activo",true).order("created_at",{ascending:false}).limit(1);const p=data?.[0];if(!p)return '<h1>Mi <em>entrenamiento</em></h1><div class="card">Tu entrenador todavía no ha publicado una rutina.</div>';const days=p.data?.days||[];return `<h1>Mi <em>entrenamiento</em></h1><div class="card"><h2>${esc(p.nombre)}</h2><p class="muted">${esc(p.objetivos)}</p></div>${days.map((d,i)=>'<div class="card"><h3>Día '+(i+1)+'</h3><h2>'+esc(d.name)+'</h2>'+(d.exercises||[]).map((x,j)=>'<div class="card"><h3>'+esc(x.name)+'</h3><p>'+esc(x.sets)+' series · '+esc(x.reps)+' reps · Descanso '+esc(x.rest)+' s</p><p class="muted">'+esc(x.notes)+'</p>'+(x.video_url?'<a href="'+esc(x.video_url)+'" target="_blank" rel="noopener">Ver vídeo del ejercicio ↗</a>':'')+'<div class="row"><label>Carga usada (kg)<input id="kg_'+i+'_'+j+'" type="number" min="0" step=".5"></label><label>Repeticiones realizadas<input id="reps_'+i+'_'+j+'" type="number" min="0" step="1"></label></div><button class="btn sm" onclick="logExercise(\''+(x.exercise_id||"")+'\',\''+esc(x.name).replace(/'/g,"")+'\',\''+i+'\',\''+j+'\')">Registrar serie</button></div>').join("")+'</div>').join("")}`},
async c_progreso(){const [m,p]=await Promise.all([sb.from("measurements").select("*").eq("client_id",me.id).order("fecha",{ascending:false}).limit(20),sb.from("photos").select("*").eq("client_id",me.id).order("fecha",{ascending:false}).limit(30)]);let pics=[];for(const x of p.data||[]){const {data}=await sb.storage.from("progress-photos").createSignedUrl(x.path,3600);pics.push({...x,url:data?.signedUrl})}return `<h1>Mi <em>evolución</em></h1><div class="card"><h3>Registrar medidas (cm)</h3><div class="row">${F("mDate","Fecha","date",today())}${F("mWaist","Cintura")}${F("mHip","Cadera")}${F("mGlute","Glúteos")}${F("mThigh","Muslo")}${F("mArm","Brazo")}${F("mChest","Pecho")}</div><button class="btn" onclick="saveMeasurements()">Guardar medidas</button></div><div class="card scroll"><h3>Historial de medidas</h3><table><tr><th>Fecha</th><th>Cintura</th><th>Cadera</th><th>Glúteos</th><th>Muslo</th><th>Brazo</th><th>Pecho</th></tr>${(m.data||[]).map(x=>'<tr><td>'+x.fecha+'</td><td>'+ (x.cintura??"—")+'</td><td>'+(x.cadera??"—")+'</td><td>'+(x.gluteos??"—")+'</td><td>'+(x.muslo??"—")+'</td><td>'+(x.brazo??"—")+'</td><td>'+(x.pecho??"—")+'</td></tr>').join("")}</table></div><div class="card"><h3>Fotografías de progreso</h3><label>Subir fotografía<input id="progressPhoto" type="file" accept="image/*"></label><button class="btn" onclick="uploadProgressPhoto()">Subir foto</button><div class="grid" style="margin-top:16px">${pics.map(x=>'<div><img src="'+x.url+'" alt="Fotografía de progreso '+x.fecha+'" style="width:100%;border-radius:10px;object-fit:cover"><p class="muted">'+x.fecha+' · '+esc(x.tipo||"Progreso")+'</p></div>').join("")}</div></div>`},
async c_perfil(){return `<h1>Mi <em>perfil</em></h1><div class="card"><div class="row">${F("myName","Nombre","text",esc(me.nombre))}${F("mySurname","Apellidos","text",esc(me.apellidos))}${F("myPhone","Teléfono","tel",esc(me.telefono))}${F("myHeight","Altura (cm)","number",me.altura_cm||"")}${F("myWeight","Peso inicial (kg)","number",me.peso_inicial||"")}${F("myJob","Profesión","text",esc(me.profesion))}</div><label>Objetivo<textarea id="myGoal" rows="2">${esc(me.objetivo)}</textarea></label><label>Lesiones o molestias<textarea id="myInjuries" rows="2">${esc(me.lesiones)}</textarea></label><label>Preferencias alimentarias<textarea id="myFoodPrefs" rows="2">${esc(me.preferencias_alimentarias)}</textarea></label><br><button class="btn" onclick="saveMyProfile()">Guardar perfil</button><p class="muted">Correo: ${esc(me.email)}</p></div>`}
};
async function clientV(id){const[p,d,r]=await Promise.all([sb.from("profiles").select("*").eq("id",id).single(),sb.from("daily_logs").select("*").eq("client_id",id).order("fecha",{ascending:false}).limit(14),sb.from("reviews").select("*").eq("client_id",id).order("fecha",{ascending:false})]);const c=p.data;
 return`<button class="btn ghost sm" onclick="sel=null;draw()">← Clientes</button><h1>${esc(c.nombre)||esc(c.email)}</h1>
 <div class="card"><h3>Ficha</h3><div class="row">${F("p_n","Nombre","text",esc(c.nombre))}${F("p_o","Objetivo","text",esc(c.objetivo))}${F("p_pi","Peso inicial",undefined,c.peso_inicial??"")}${F("p_al","Altura (cm)",undefined,c.altura_cm??"")}${F("p_t","Teléfono","text",esc(c.telefono))}</div><button class="btn" onclick="saveFicha('${id}')">Guardar ficha</button></div>
 <div class="card scroll"><h3>Registros diarios</h3><table><tr><th>Fecha</th><th>Peso</th><th>Energía</th><th>Hambre</th><th>Sueño</th><th>Agua</th><th>Pasos</th><th>Dieta</th></tr>${(d.data||[]).map(x=>`<tr><td>${x.fecha}</td><td>${x.peso??"-"}</td><td>${x.energia??"-"}</td><td>${x.hambre??"-"}</td><td>${x.sueno??"-"}</td><td>${x.agua_l??"-"}</td><td>${x.pasos??"-"}</td><td>${x.sigue_dieta??"-"}</td></tr>`).join("")}</table></div>
 ${(r.data||[]).map(x=>`<div class="card"><b>${x.fecha} · ${x.peso??"-"} kg</b> <span class="tag ${x.estado=="completada"?"":"off"}">${x.estado}</span><p class="muted">Dieta ${x.adh_dieta??"-"}% · Entreno ${x.adh_entreno??"-"}% · ${esc(x.comentarios)}</p><textarea id="fb${x.id}" rows="2" placeholder="Feedback…">${esc(x.feedback)}</textarea><br><br><button class="btn sm" onclick="fb('${x.id}')">Guardar feedback y completar</button></div>`).join("")}
 <h3>Mensajes</h3>`+await msgsV(id)}
async function setEstado(id,estado){if(ok(await sb.from("profiles").update({estado}).eq("id",id)))draw()}
async function saveFicha(id){if(ok(await sb.from("profiles").update({nombre:sv("p_n"),objetivo:sv("p_o"),peso_inicial:nv("p_pi"),altura_cm:nv("p_al"),telefono:sv("p_t")}).eq("id",id)))alert("Guardado")}
async function fb(id){if(ok(await sb.from("reviews").update({feedback:sv("fb"+id),estado:"completada"}).eq("id",id)))draw()}
async function saveDaily(){const r=await sb.from("daily_logs").upsert({client_id:me.id,fecha:sv("d_f"),peso:nv("d_p"),energia:nv("d_e"),hambre:nv("d_h"),sueno:nv("d_s"),horas_sueno:nv("d_hs"),estres:nv("d_st"),animo:nv("d_a"),sigue_dieta:sv("d_d"),agua_l:nv("d_w"),pasos:nv("d_pa"),entreno:sv("d_en")=="true",cardio_min:nv("d_c"),observaciones:sv("d_o")},{onConflict:"client_id,fecha"});if(ok(r))draw()}
async function saveRev(){if(ok(await sb.from("reviews").insert({client_id:me.id,fecha:sv("r_f"),peso:nv("r_p"),adh_dieta:nv("r_ad"),adh_entreno:nv("r_at"),energia:nv("r_e"),hambre:nv("r_h"),sueno:nv("r_s"),estres:nv("r_st"),comentarios:sv("r_c")}))){alert("Revisión enviada");draw()}}

let foodsCache=[],exCache=[],planDraft=null,planClient=null;
function newPlan(type){planClient=document.querySelector("#planClient")?.value||null;if(!planClient)return alert("Selecciona un cliente");planDraft={id:null,client_id:planClient,tipo:type,nombre:type==="dieta"?"Plan nutricional":"Plan de entrenamiento",objetivos:"",observaciones:"",targets:{kcal:0,protein:0,carbs:0,fat:0},meals:[{name:"Comida 1",foods:[]}],days:[{name:"Día 1",exercises:[]}]};draw()}
async function editPlan(id){const {data,error}=await sb.from("plans").select("*").eq("id",id).single();if(error)return alert(error.message);planDraft={...data.data,id:null,client_id:data.client_id,tipo:data.tipo,nombre:data.nombre,objetivos:data.objetivos,observaciones:data.observaciones,version:data.version,targets:data.data?.targets||{kcal:0,protein:0,carbs:0,fat:0},meals:data.data?.meals||[{name:"Comida 1",foods:[]}],days:data.data?.days||[{name:"Día 1",exercises:[]}]};planClient=data.client_id;draw()}
async function planEditor(){const [f,e]=await Promise.all([sb.from("foods").select("*").order("nombre"),sb.from("exercises").select("*").order("nombre")]);foodsCache=f.data||[];exCache=e.data||[];const d=planDraft;const diet=d.tipo==="dieta";return `<button class="btn ghost sm" onclick="planDraft=null;draw()">← Volver a planes</button><h1>Crear <em>${diet?"dieta":"entrenamiento"}</em></h1><div class="card"><div class="row"><label>Nombre<input id="planName" value="${esc(d.nombre)}"></label><label>Objetivo<input id="planGoal" value="${esc(d.objetivos)}"></label></div>${diet?'<div class="row"><label>Kcal objetivo<input id="targetK" type="number" value="'+(d.targets.kcal||0)+'"></label><label>Proteína (g)<input id="targetP" type="number" value="'+(d.targets.protein||0)+'"></label><label>Hidratos (g)<input id="targetC" type="number" value="'+(d.targets.carbs||0)+'"></label><label>Grasas (g)<input id="targetG" type="number" value="'+(d.targets.fat||0)+'"></label></div>':""}</div>${diet?d.meals.map((m,i)=>'<div class="card"><div class="row"><label>Comida<input value="'+esc(m.name)+'" onchange="planDraft.meals['+i+'].name=this.value"></label><button class="btn ghost sm" onclick="addPlanFood('+i+')">+ Añadir alimento</button><button class="btn ghost sm" onclick="planDraft.meals.splice('+i+',1);draw()">Eliminar comida</button></div><div class="scroll"><table><tr><th>Alimento</th><th>Gramos</th><th>Kcal</th><th>P</th><th>HC</th><th>G</th><th></th></tr>'+m.foods.map((x,j)=>{const q=(+x.grams||0)/100;return '<tr><td>'+esc(x.name)+'</td><td><input type="number" min="0" value="'+x.grams+'" onchange="updateDraftGram('+i+','+j+',this.value)"></td><td>'+Math.round((+x.kcal_100||0)*q)+'</td><td>'+((+x.prot_100||0)*q).toFixed(1)+'</td><td>'+((+x.hc_100||0)*q).toFixed(1)+'</td><td>'+((+x.grasa_100||0)*q).toFixed(1)+'</td><td><button class="btn ghost sm" onclick="planDraft.meals['+i+'].foods.splice('+j+',1);draw()">×</button></td></tr>'}).join("")+'</table></div></div>').join("")+'<button class="btn ghost" onclick="planDraft.meals.push({name:\'Nueva comida\',foods:[]});draw()">+ Añadir comida</button>':d.days.map((day,i)=>'<div class="card"><div class="row"><label>Día<input value="'+esc(day.name)+'" onchange="planDraft.days['+i+'].name=this.value"></label><button class="btn ghost sm" onclick="addPlanExercise('+i+')">+ Añadir ejercicio</button><button class="btn ghost sm" onclick="planDraft.days.splice('+i+',1);draw()">Eliminar día</button></div>'+day.exercises.map((x,j)=>'<div class="row"><div><b>'+esc(x.name)+'</b><p class="muted">'+esc(x.grupo_principal)+'</p></div><label>Series<input type="number" value="'+x.sets+'" onchange="planDraft.days['+i+'].exercises['+j+'].sets=this.value"></label><label>Reps<input value="'+esc(x.reps)+'" onchange="planDraft.days['+i+'].exercises['+j+'].reps=this.value"></label><label>Descanso (s)<input type="number" value="'+x.rest+'" onchange="planDraft.days['+i+'].exercises['+j+'].rest=this.value"></label><button class="btn ghost sm" onclick="planDraft.days['+i+'].exercises.splice('+j+',1);draw()">×</button></div>').join("")+'</div>').join("")+'<button class="btn ghost" onclick="planDraft.days.push({name:\'Nuevo día\',exercises:[]});draw()">+ Añadir día</button>'}<div class="card"><label>Notas para el cliente<textarea id="planNotes" rows="3">${esc(d.observaciones)}</textarea></label><br><button class="btn" onclick="savePlan()">Publicar nueva versión</button> <button class="btn ghost" onclick="savePlanAsTemplate()">Guardar como plantilla</button></div>` }
function addPlanFood(i){if(!foodsCache.length)return alert("Primero añade alimentos en Biblioteca");const id=prompt("Introduce el número del alimento:\n"+foodsCache.map((x,n)=>(n+1)+". "+x.nombre).join("\n"));const f=foodsCache[Number(id)-1];if(!f)return;planDraft.meals[i].foods.push({food_id:f.id,name:f.nombre,grams:100,kcal_100:f.kcal_100,prot_100:f.prot_100,hc_100:f.hc_100,grasa_100:f.grasa_100});draw()}
function updateDraftGram(i,j,v){planDraft.meals[i].foods[j].grams=Number(v)||0;draw()}
function addPlanExercise(i){if(!exCache.length)return alert("Primero añade ejercicios en Biblioteca");const id=prompt("Introduce el número del ejercicio:\n"+exCache.map((x,n)=>(n+1)+". "+x.nombre).join("\n"));const x=exCache[Number(id)-1];if(!x)return;planDraft.days[i].exercises.push({exercise_id:x.id,name:x.nombre,grupo_principal:x.grupo_principal,sets:3,reps:"8-12",rest:90,notes:x.indicaciones||"",video_url:x.video_url||""});draw()}
async function savePlan(){const name=document.querySelector("#planName").value.trim();if(!name)return alert("Escribe un nombre para el plan");const type=planDraft.tipo;const {data:prev}=await sb.from("plans").select("version").eq("client_id",planDraft.client_id).eq("tipo",type).order("version",{ascending:false}).limit(1);const version=(prev?.[0]?.version||0)+1;const data=type==="dieta"?{targets:{kcal:Number(document.querySelector("#targetK").value)||0,protein:Number(document.querySelector("#targetP").value)||0,carbs:Number(document.querySelector("#targetC").value)||0,fat:Number(document.querySelector("#targetG").value)||0},meals:planDraft.meals}:{days:planDraft.days};const old=await sb.from("plans").update({activo:false}).eq("client_id",planDraft.client_id).eq("tipo",type).eq("activo",true);if(old.error)return alert(old.error.message);const r=await sb.from("plans").insert({client_id:planDraft.client_id,tipo:type,nombre:name,objetivos:document.querySelector("#planGoal").value,observaciones:document.querySelector("#planNotes").value,data,version,activo:true});if(r.error)return alert(r.error.message);planDraft=null;alert("Plan publicado como versión "+version);draw()}
async function savePlanAsTemplate(){const name=document.querySelector("#planName").value.trim();if(!name)return alert("Escribe un nombre");const type=planDraft.tipo;const data=type==="dieta"?{targets:{kcal:Number(document.querySelector("#targetK").value)||0,protein:Number(document.querySelector("#targetP").value)||0,carbs:Number(document.querySelector("#targetC").value)||0,fat:Number(document.querySelector("#targetG").value)||0},meals:planDraft.meals}:{days:planDraft.days};const r=await sb.from("templates").insert({tipo:type,nombre:name,objetivo:document.querySelector("#planGoal").value,data});if(r.error)return alert(r.error.message);alert("Plantilla guardada sin modificar el plan");}
async function useTemplate(id){const {data:t,error}=await sb.from("templates").select("*").eq("id",id).single();if(error)return alert(error.message);const {data:c}=await sb.from("profiles").select("id,nombre,email").eq("role","client");const client=prompt("Introduce el número del cliente:\n"+(c||[]).map((x,i)=>(i+1)+". "+(x.nombre||x.email)).join("\n"));const target=c?.[Number(client)-1];if(!target)return;tab="planes";planDraft={client_id:target.id,tipo:t.tipo,nombre:t.nombre,objetivos:t.objetivo||"",observaciones:"",targets:t.data?.targets||{kcal:0,protein:0,carbs:0,fat:0},meals:t.data?.meals||[],days:t.data?.days||[]};draw()}
async function saveFood(){const nombre=sv("foodName").trim();if(!nombre)return alert("Escribe el nombre del alimento");const r=await sb.from("foods").insert({nombre,kcal_100:nv("foodK")||0,prot_100:nv("foodP")||0,hc_100:nv("foodC")||0,grasa_100:nv("foodG")||0});if(r.error)return alert(r.error.message);draw()}
async function saveExercise(){const nombre=sv("exName").trim();if(!nombre)return alert("Escribe el nombre del ejercicio");const r=await sb.from("exercises").insert({nombre,grupo_principal:sv("exGroup"),video_url:sv("exVideo"),indicaciones:sv("exNotes")});if(r.error)return alert(r.error.message);draw()}
async function logExercise(exerciseId,name,di,dj){const kg=Number(sv("kg_"+di+"_"+dj))||0,reps=Number(sv("reps_"+di+"_"+dj))||0;const r=await sb.from("workout_logs").insert({client_id:me.id,exercise_id:exerciseId||null,sets:[{exercise_name:name,kg,reps,completed_at:new Date().toISOString()}]});if(r.error)return alert(r.error.message);alert("Serie registrada en tu historial")}
async function saveMeasurements(){const r=await sb.from("measurements").insert({client_id:me.id,fecha:sv("mDate"),cintura:nv("mWaist"),cadera:nv("mHip"),gluteos:nv("mGlute"),muslo:nv("mThigh"),brazo:nv("mArm"),pecho:nv("mChest")});if(r.error)return alert(r.error.message);draw()}
async function uploadProgressPhoto(){const file=document.querySelector("#progressPhoto")?.files?.[0];if(!file)return alert("Selecciona una foto");if(!file.type.startsWith("image/")||file.size>12*1024*1024)return alert("La imagen debe ser válida y pesar menos de 12 MB");const path=me.id+"/"+Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const up=await sb.storage.from("progress-photos").upload(path,file,{contentType:file.type,upsert:false});if(up.error)return alert(up.error.message);const row=await sb.from("photos").insert({client_id:me.id,fecha:today(),tipo:"Progreso",path});if(row.error)return alert(row.error.message);draw()}
async function saveMyProfile(){const r=await sb.from("profiles").update({nombre:sv("myName"),apellidos:sv("mySurname"),telefono:sv("myPhone"),altura_cm:nv("myHeight"),peso_inicial:nv("myWeight"),profesion:sv("myJob"),objetivo:sv("myGoal"),lesiones:sv("myInjuries"),preferencias_alimentarias:sv("myFoodPrefs")}).eq("id",me.id);if(r.error)return alert(r.error.message);alert("Perfil actualizado");boot()}

boot();
</script></body></html>
