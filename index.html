 const {data:client,error}=await sb.from("profiles").select("id,nombre,apellidos,email,role").eq("id",id).single();
 if(error||!client||client.role!=="client")return alert("No se ha podido identificar al cliente. No se ha borrado ningún dato.");
 const fullName=[client.nombre,client.apellidos].filter(Boolean).join(" ")||"este cliente";
 const typed=prompt("ELIMINACIÓN DEFINITIVA\\n\\nVas a borrar a "+fullName+" ("+client.email+").\\n\\nSe eliminarán su cuenta, perfil, dietas, entrenamientos, revisiones, medidas, registros, mensajes y archivos.\\n\\nEscribe ELIMINAR para continuar:");

  if(chatSel===id)chatSel=null;

 }finally{deletingClient=false}
}

async function submitFullReview(){
 const btn=$("#sendFullReview");if(!btn)return;

 const files=[
  ...[["Frontal",$("#reviewFront")?.files?.[0]],["Lateral",$("#reviewSide")?.files?.[0]],["Espalda",$("#reviewBack")?.files?.[0]]].filter(x=>x[1]),
  ...Array.from($("#reviewExtra")?.files||[]).map(f=>["Adicional · "+f.name,f])
 ];
 if(files.some(([_,f])=>!f.type.startsWith("image/")||f.size>12*1024*1024))return alert("Todas las fotos deben ser imágenes de menos de 12 MB.");
 btn.disabled=true;btn.textContent="Enviando revisión…";
 let reviewId=null,issues=[];
 try{
  const review={client_id:me.id,fecha:date,peso:nv("r_p"),adh_dieta:nv("r_ad"),adh_entreno:nv("r_at"),energia:nv("r_e"),hambre:nv("r_h"),digestiones:nv("r_dig"),sueno:nv("r_s"),estres:nv("r_st"),dificultades:sv("r_diff"),cambios_fisicos:sv("r_changes"),sensaciones:sv("r_sens"),comentarios:[sv("r_comments"),sv("d_food"),sv("d_misc")].filter(Boolean).join("\n\n"),estado:"pendiente"};

  const dr=await sb.from("daily_logs").upsert(daily,{onConflict:"client_id,fecha"});
  if(dr.error)issues.push("Registro de actividad: "+dr.error.message);
  const measures={client_id:me.id,fecha:date,cintura:nv("mWaist"),cadera:nv("mHip"),gluteos:nv("mGlute"),muslo:nv("mThigh"),brazo:nv("mArm"),pecho:nv("mChest")};
  if(Object.values(measures).slice(2).some(v=>v!==null)){const mr=await sb.from("measurements").insert(measures);if(mr.error)issues.push("Medidas: "+mr.error.message);}
  for(let i=0;i<files.length;i++){
   const [kind,file]=files[i],safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_"),path=me.id+"/"+Date.now()+"-"+i+"-"+safe;

   if(pr.error){issues.push("Guardar foto "+kind+": "+pr.error.message);await sb.storage.from("progress-photos").remove([path]);}
  }
  if(issues.length)alert("La revisión principal se ha guardado, pero hay apartados que no se han podido guardar:\n"+issues.join("\n"));
  else alert("¡Revisión completa enviada correctamente!");
  tab="revision";await draw();
 }catch(e){alert(e.message||"No se pudo enviar la revisión.");}
 finally{const current=$("#sendFullReview");if(current){current.disabled=false;current.textContent="Enviar revisión completa";}}
}

function normDiet(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
function matchDietFood(line){
 const text=normDiet(line);let best=null,score=0;
 for(const f of foodsCache){const name=normDiet(f.nombre);if(!name)continue;if(text.includes(name)){let s=1+name.length/1000;if(s>score){best=f;score=s}continue}const words=name.split(" ").filter(x=>x.length>2);const hits=words.filter(x=>text.includes(x)).length;const s=words.length?hits/words.length:0;if(hits>=2&&s>=.75&&s>score){best=f;score=s}}
 return best;
}
async function parseDietPdf(){

 if(file.type!=="application/pdf"&&!file.name.toLowerCase().endsWith(".pdf"))return alert("El archivo debe ser un PDF.");
 if(file.size>20*1024*1024)return alert("El PDF no puede superar los 20 MB.");
 if(!window.pdfjsLib)return alert("No se ha podido cargar el lector PDF. Actualiza la página e inténtalo de nuevo.");
 try{
  const {data:foods,error}=await sb.from("foods").select("*").order("nombre");if(error)throw error;foodsCache=foods||[];
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let lines=[];
  for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),content=await page.getTextContent(),groups=new Map();for(const item of content.items){if(!item.str||!item.str.trim())continue;let y=Math.round(item.transform[5]/3)*3;let arr=groups.get(y)||[];arr.push({x:item.transform[4],s:item.str.trim()});groups.set(y,arr)}for(const [y,items] of groups){items.sort((a,b)=>a.x-b.x);lines.push({page:p,y,text:items.map(x=>x.s).join("  ")})}}
  lines.sort((a,b)=>a.page-b.page||b.y-a.y);
  const meals={training:[],recovery:[]},notes=[],warnings=[];let currentMeal=null,detected=0,omitted=0;
  const parseOpt=s=>{s=String(s||"").replace(/^[\s\-–—•]+/,"").trim();const m=s.match(/^(\d+(?:[.,]\d+)?)\s*(g|gr|gramos|ml|cl|l|ud|uds|unidad(?:es)?|huevo(?:s)?|lata(?:s)?)\s*(.*)$/i);if(!m)return null;const amount=Number(m[1].replace(",",".")),unit=m[2].toLowerCase(),name=(m[3]||"").replace(/^[\s:,-]+/,"").trim();if(!amount||!name)return null;const food=matchDietFood(name);return {source_name:name,name:food?.nombre||name,food_id:food?.id||null,grams:amount,kcal_100:+food?.kcal_100||0,prot_100:+food?.prot_100||0,hc_100:+food?.hc_100||0,grasa_100:+food?.grasa_100||0,unit}};
  const rowFor=opts=>{const x=opts[0];return {...x,source_name:opts.map(o=>o.source_name+" ("+o.grams+" "+o.unit+")").join(" / "),alternatives:opts.map(o=>({...o})),choice_label:opts.map(o=>o.name+" · "+o.grams+" "+o.unit).join(" / ")}};
  for(const r of lines){let line=r.text.replace(/\s+/g," ").trim();if(!line)continue;
   const h=line.match(/\bCOMIDA\s*([1-9])\b/i);if(h){currentMeal={name:"Comida "+h[1],foods:[]};meals.training.push(currentMeal);meals.recovery.push({name:currentMeal.name,foods:[]});line=line.replace(h[0]," ").trim();if(!line)continue}
   const off=line.match(/\(\s*d[ií]as?\s*off\s*([^)]*)\)/i),main=line.replace(/\(\s*d[ií]as?\s*off[^)]*\)/ig," ").replace(/^[\s\-–—•]+/,"").trim();
   if(!/\d+(?:[.,]\d+)?\s*(?:g|gr|gramos|ml|cl|l|ud|uds|unidad(?:es)?|huevo(?:s)?|lata(?:s)?)\b/i.test(main)){if(line.length>3)notes.push(line);continue}
   if(!currentMeal){currentMeal={name:"Comida 1",foods:[]};meals.training.push(currentMeal);meals.recovery.push({name:"Comida 1",foods:[]})}
   const mainOpts=main.split(/\/\/+/).map(parseOpt).filter(Boolean),offOpts=off?off[1].split(/\/\/+/).map(parseOpt).filter(Boolean):null;if(!mainOpts.length){notes.push(line);continue}

  }

  const calc=arr=>arr.reduce((a,m)=>{m.foods.forEach(x=>{let q=(+x.grams||0)/100;a.k+=(+x.kcal_100||0)*q;a.p+=(+x.prot_100||0)*q;a.c+=(+x.hc_100||0)*q;a.g+=(+x.grasa_100||0)*q});return a},{k:0,p:0,c:0,g:0});
  const unmatched=[...meals.training,...meals.recovery].flatMap(m=>m.foods).filter(x=>!x.food_id).length;if(unmatched)warnings.push(unmatched+" opciones necesitan relacionarse con la biblioteca antes de publicar.");
  if(omitted)warnings.push(omitted+" alimento(s) marcados «sin este días OFF» se han omitido en descanso.");
  if(notes.length)warnings.push(notes.length+" indicaciones de ayuno, entrenamiento, suplementación y observaciones se han conservado.");
  const t=calc(meals.training),r=calc(meals.recovery);
  dietImport={fileName:file.name,client_id:document.querySelector("#pdfClient")?.value||null,name:file.name.replace(/\.pdf$/i,""),goal:"",notes:notes.join("\n\n"),meals:meals.training,recoveryMeals:meals.recovery,activeSet:"training",targetsTraining:{kcal:Math.round(t.k),protein:Math.round(t.p),carbs:Math.round(t.c),fat:Math.round(t.g)},targetsRecovery:{kcal:Math.round(r.k),protein:Math.round(r.p),carbs:Math.round(r.c),fat:Math.round(r.g)},warnings};
  dietImportMode=true;dietPdfFile=null;await draw();
 }catch(e){console.error("PDF diet import:",e);alert("No se ha podido leer el PDF: "+(e.message||"Error desconocido"))}
}
var dietSwapFoods=[];
function dietFoodCategory(f){
 const h=Math.max(0,+f.hc_100||0)*4,p=Math.max(0,+f.prot_100||0)*4,g=Math.max(0,+f.grasa_100||0)*9;

}
function changeDietFood(planId,set,mealIndex,foodIndex,foodId,baseGrams,baseMacro,macroKey){
 const key="diet-swaps:"+me.id+":"+planId+":"+set;let swaps={};try{swaps=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
 const rowKey=mealIndex+":"+foodIndex;
 if(!foodId){delete swaps[rowKey];localStorage.setItem(key,JSON.stringify(swaps));return draw()}
 const f=dietSwapFoods.find(x=>String(x.id)===String(foodId));if(!f)return alert("No se ha encontrado ese alimento en la biblioteca.");
 const density=+f[macroKey]||0,sourceAmount=(+baseGrams||0)*(+baseMacro||0)/100;
 if(density<=0||sourceAmount<=0)return alert("No se puede calcular una equivalencia para este alimento.");

}

 if(!client)return alert("No se ha encontrado ese cliente activo. Actualiza la lista.");
 const clientName=[client.nombre,client.apellidos].filter(Boolean).join(" ")||client.email||"el cliente";
 if(!confirm("¿Asignar \""+t.nombre+"\" a "+clientName+"? Se publicará una nueva versión y el plan activo anterior pasará al histórico."))return;
 const {data:previous,error:previousError}=await sb.from("plans").select("id,version,activo").eq("client_id",clientId).eq("tipo",t.tipo).order("version",{ascending:false});
 if(previousError)return alert("No se pudo comprobar el plan anterior: "+previousError.message);
 const version=(previous?.[0]?.version||0)+1;
 const oldIds=(previous||[]).filter(p=>p.activo).map(p=>p.id);
 if(oldIds.length){
  const archived=await sb.from("plans").update({activo:false}).eq("client_id",clientId).eq("tipo",t.tipo).eq("activo",true);
  if(archived.error)return alert("No se pudo archivar el plan anterior: "+archived.error.message);
 }
 const inserted=await sb.from("plans").insert({client_id:clientId,tipo:t.tipo,nombre:t.nombre,objetivos:t.objetivo||"",observaciones:"",data:t.data||{},version,activo:true,template_id:t.id});
 if(inserted.error){
  if(oldIds.length)await sb.from("plans").update({activo:true}).in("id",oldIds);
  return alert("No se pudo asignar la plantilla: "+inserted.error.message);
 }
 templateAssign=null;
 alert("Plantilla \""+t.nombre+"\" asignada correctamente a "+clientName+".");
 tab="plantillas";
 await draw();
}
async function saveFood(){const nombre=sv("foodName").trim();if(!nombre)return alert("Escribe el nombre del alimento");const r=await sb.from("foods").insert({nombre,kcal_100:nv("foodK")||0,prot_100:nv("foodP")||0,hc_100:nv("foodC")||0,grasa_100:nv("foodG")||0,peso_unidad_g:nv("foodUnit")});if(r.error)return alert(r.error.message);draw()}
async function saveExercise(){const nombre=sv("exName").trim();if(!nombre)return alert("Escribe el nombre del ejercicio");const r=await sb.from("exercises").insert({nombre,grupo_principal:sv("exGroup"),video_url:sv("exVideo"),indicaciones:sv("exNotes")});if(r.error)return alert(r.error.message);draw()}
function refreshStepProgress(){const count=Math.max(0,Number($("#stepsToday")?.value)||0),goal=Math.max(1,Number($("#stepsGoal")?.value)||1),pct=Math.min(100,Math.round(count/goal*100)),remaining=Math.max(0,goal-count),fill=$("#stepsProgressFill"),txt=$("#stepsProgressText");if(fill)fill.style.width=pct+"%";if(txt)txt.innerHTML='<span>'+count.toLocaleString("es-ES")+' / '+goal.toLocaleString("es-ES")+' pasos</span><span style="color:var(--lime)">'+(pct>=100?'¡Objetivo conseguido!':'Te faltan '+remaining.toLocaleString("es-ES")+' pasos')+'</span>';const badge=document.querySelector(".card[style*='border-color:rgba(182,243,107,.45)'] .tag");if(badge)badge.textContent=pct+"% del objetivo";}
async function saveStepsLog(){const count=Number($("#stepsToday")?.value),goal=Number($("#stepsGoal")?.value);if(!Number.isInteger(count)||count<0)return alert("Introduce un número válido de pasos.");if(!Number.isInteger(goal)||goal<1)return alert("El objetivo debe ser al menos 1 paso.");const assigned=await sb.from("profiles").select("pasos_objetivo").eq("id",me.id).single();if(Number(assigned.data?.pasos_objetivo||10000)!==goal)return alert("El objetivo diario lo establece tu entrenador. Contacta con él si necesitas cambiarlo.");const fecha=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Madrid",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());const existing=await sb.from("daily_logs").select("id").eq("client_id",me.id).eq("fecha",fecha).maybeSingle();let r;if(existing.data?.id)r=await sb.from("daily_logs").update({pasos:count}).eq("id",existing.data.id);else r=await sb.from("daily_logs").insert({client_id:me.id,fecha,pasos:count});if(r.error)return alert("No se pudieron guardar los pasos: "+r.error.message);alert("Pasos y objetivo guardados.");draw();}
async function saveExerciseLog(exerciseId,name,di,dj){const kg=Number(sv("kg_"+di+"_"+dj)),reps=Number(sv("reps_"+di+"_"+dj));if(!Number.isFinite(kg)||kg<0)return alert("Introduce la carga utilizada.");if(!Number.isFinite(reps)||reps<0)return alert("Introduce las repeticiones realizadas.");const d=new Date(),fecha=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");const r=await sb.from("workout_logs").insert({client_id:me.id,exercise_id:exerciseId||null,fecha,sets:[{exercise_name:name,kg,reps,completed:true,day_index:Number(di),slot_key:di+"-"+dj,completed_at:d.toISOString()}]});if(r.error)return alert(r.error.message);alert("Carga guardada y ejercicio marcado como hecho.");draw()}
async function toggleExerciseDone(checked,exerciseId,name,di,dj){const d=new Date(),fecha=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");const kg=Number(sv("kg_"+di+"_"+dj)),reps=Number(sv("reps_"+di+"_"+dj));const r=await sb.from("workout_logs").insert({client_id:me.id,exercise_id:exerciseId||null,fecha,sets:[{exercise_name:name,kg:Number.isFinite(kg)?kg:null,reps:Number.isFinite(reps)?reps:null,completed:checked,day_index:Number(di),slot_key:di+"-"+dj,completed_at:d.toISOString()}]});if(r.error){alert(r.error.message);draw();return}draw()}
async function saveMeasurements(){const r=await sb.from("measurements").insert({client_id:me.id,fecha:sv("mDate"),cintura:nv("mWaist"),cadera:nv("mHip"),gluteos:nv("mGlute"),muslo:nv("mThigh"),brazo:nv("mArm"),pecho:nv("mChest")});if(r.error)return alert(r.error.message);draw()}
async function uploadProgressPhoto(){const file=document.querySelector("#progressPhoto")?.files?.[0];if(!file)return alert("Selecciona una foto");if(!file.type.startsWith("image/")||file.size>12*1024*1024)return alert("La imagen debe ser válida y pesar menos de 12 MB");const path=me.id+"/"+Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const up=await sb.storage.from("progress-photos").upload(path,file,{contentType:file.type,upsert:false});if(up.error)return alert(up.error.message);const row=await sb.from("photos").insert({client_id:me.id,fecha:today(),tipo:"Progreso",path});if(row.error)return alert(row.error.message);draw()}
async function saveMyProfile(){const r=await sb.from("profiles").update({nombre:sv("myName"),apellidos:sv("mySurname"),edad:nv("myAge"),telefono:sv("myPhone"),altura_cm:nv("myHeight"),peso_inicial:nv("myWeight"),profesion:sv("myJob"),objetivo:sv("myGoal"),alergias:sv("myAllergies"),patologias:sv("myPathologies"),lesiones:sv("myInjuries"),preferencias_alimentarias:sv("myFoodPrefs")}).eq("id",me.id);if(r.error)return alert(r.error.message);alert("Perfil actualizado");boot()}

document.addEventListener('input',e=>{if(e.target?.id==='stepsToday'||e.target?.id==='stepsGoal')refreshStepProgress()});
boot();
</script></body></html>
